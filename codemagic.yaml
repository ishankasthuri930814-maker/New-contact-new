workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_ndk
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Generate Clean String Resources
        script: |
          STRINGS_DIR="app/src/main/res/values"
          mkdir -p "$STRINGS_DIR"
          cat << 'EOF' > "$STRINGS_DIR/strings.xml"
          <resources>
              <string name="app_name">Police Directory</string>
              <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
              <string name="default_web_client_id">dummy_client_id</string>
              <string name="facebook_app_id">1234567890</string>
              <string name="facebook_client_token">dummy_facebook_client_token</string>
              <string name="fb_login_protocol_scheme">fb1234567890</string>
          </resources>
          EOF
      - name: Generate Dummy Keystore
        script: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Download and Use Gradle 9.3.1
        script: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d $HOME
          export PATH=$HOME/gradle-9.3.1/bin:$PATH
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
